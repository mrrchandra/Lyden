# Lyden nano config: ~5M params for CI / smoke tests on any machine.
model:
  vocab_size: 8192
  dim: 128
  n_layers: 8
  layer_pattern: "mmma"
  mamba: {d_state: 32, d_conv: 4, expand: 2}
  attention: {n_heads: 4, n_kv_heads: 2, window: 128, n_summary: 16, topk: 32, rope_base: 10000.0}
  dense_ffn: {hidden: 512, activation: "swiglu"}
  moe: {n_routed: 8, n_shared: 2, top_k: 2, expert_hidden: 256, balance: "loss_free", aux_loss_weight: 0.01}
  dropout: 0.0
  weight_tying: true
training:
  lr: 1.0e-3
  trunk_lr_mult: 0.1
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 200
  total_steps: 5000
  grad_accum: 1
  amp: "bf16"
  seq_len: 512
  batch_size: 32
  checkpoint_every: 1000
  keep_last: 3
  log_every: 10
  log_backend: "console"
  out_dir: "runs"
data:
  dataset: "synthetic"
  data_dir: "~/lyden-data"
  tokenizer_dir: "~/lyden-data/tokenizer-nano"
  val_fraction: 0.01
clm:
  buffer_max_chars: 4000
seed: 1337
run_name: "nano"
