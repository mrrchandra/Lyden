model:
  vocab_size: 32768
  dim: 512
  n_layers: 16
  layer_pattern: mmma
  mamba:
    d_state: 128
    d_conv: 4
    expand: 2
  attention:
    n_heads: 8
    n_kv_heads: 2
    window: 512
    n_summary: 64
    topk: 256
    rope_base: 10000.0
  dense_ffn:
    hidden: 2048
    activation: swiglu
  moe:
    n_routed: 8
    n_shared: 2
    top_k: 2
    expert_hidden: 512
    balance: loss_free
    aux_loss_weight: 0.01
    bias_gamma: 0.001
    bias_gamma_ramp:
    - 0.004
    - 0.001
    - 400
    router_znorm: true
  dropout: 0.0
  weight_tying: true
training:
  lr: 8.0e-05
  trunk_lr_mult: 0.1
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 100
  total_steps: 220
  grad_accum: 16
  amp: fp16
  seq_len: 8192
  batch_size: 1
  activation_checkpoint: true
  checkpoint_every: 200
  keep_last: 3
  log_every: 10
  log_backend: console
  out_dir: runs
  reset_scheduler: true
  reset_moe_bias: true
data:
  dataset: tinystories
  data_dir: /kaggle/working/lyden-data-m12-c
  tokenizer_dir: /kaggle/working/lyden-data/tokenizer
  val_fraction: 0.01
clm:
  buffer_max_chars: 20000
  edit_start: <|edit|>
  edit_end: <|/edit|>
  context_start: <|context|>
  context_end: <|/context|>
seed: 1338
run_name: 100m-m12-c
