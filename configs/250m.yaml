# Lyden 250M config (default): trains on a single consumer GPU with >=8GB VRAM.
model:
  vocab_size: 32768
  dim: 768
  n_layers: 24
  layer_pattern: "mmma"
  mamba: {d_state: 128, d_conv: 4, expand: 2}
  attention: {n_heads: 8, n_kv_heads: 2, window: 512, n_summary: 64, topk: 256, rope_base: 10000.0}
  dense_ffn: {hidden: 2048, activation: "swiglu"}
  moe: {n_routed: 8, n_shared: 2, top_k: 2, expert_hidden: 512, balance: "loss_free", aux_loss_weight: 0.01}
  dropout: 0.0
  weight_tying: true
training:
  lr: 3.0e-4
  trunk_lr_mult: 0.1
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 2000
  total_steps: 100000
  grad_accum: 4
  amp: "bf16"
  seq_len: 2048
  batch_size: 8
  checkpoint_every: 5000
  keep_last: 3
  log_every: 10
  log_backend: "tensorboard"
  out_dir: "runs"
data:
  dataset: "fineweb_mix"
  data_dir: "~/lyden-data"
  tokenizer_dir: "~/lyden-data/tokenizer"
  val_fraction: 0.01
clm:
  buffer_max_chars: 20000
seed: 1337
run_name: "250m"
